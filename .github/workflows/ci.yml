name: CI & Build

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' && !startsWith(github.ref, 'refs/tags/v') }}

permissions:
  contents: read

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  DOCKERHUB_REPO: yadisk/yandex-disk

jobs:
  lint:
    name: Lint Dockerfile and Shell Scripts
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Lint Dockerfile with Hadolint
        uses: hadolint/hadolint-action@v3.5.0
        with:
          dockerfile: Dockerfile
          failure-threshold: warning

      - name: Lint shell scripts with ShellCheck
        uses: ludeeus/action-shellcheck@2.0.0
        with:
          scandir: '.'

  script-tests:
    name: Test Shell Script Behavior
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Run tests without Docker
        run: make test-unit

  build:
    # Preserve the existing check name for repository rules.
    name: Build & Push Docker Image
    needs: [lint, script-tests]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    outputs:
      image_fingerprint: ${{ steps.fingerprint.outputs.sha256 }}
      # Reuse the producer's scope even when only the publish job is retried.
      cache_scope: release-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build Docker image for testing
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          load: true
          tags: yandex-disk:test
          # Refresh apt packages for releases and export their cache to the publish job.
          no-cache-filters: ${{ startsWith(github.ref, 'refs/tags/v') && 'runtime' || '' }}
          cache-from: type=gha
          # Isolate release caches by run and attempt; keep the shared cache for branches and PRs.
          cache-to: type=gha,mode=max,scope=${{ startsWith(github.ref, 'refs/tags/v') && format('release-{0}-{1}', github.run_id, github.run_attempt) || 'buildkit' }}

      - name: Run automated tests
        run: |
          chmod +x tests/test.sh
          ./tests/test.sh yandex-disk:test

      - name: Run Trivy vulnerability scanner
        id: trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: yandex-disk:test
          format: 'sarif'
          output: 'trivy-results.sarif'
          severity: 'CRITICAL,HIGH'

      - name: Upload Trivy scan results to GitHub Security
        if: always() && steps.trivy.outcome != 'skipped'
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: 'trivy-results.sarif'

      - name: Record tested image fingerprint
        id: fingerprint
        shell: bash
        run: |
          image_fingerprint=$(
            docker image inspect yandex-disk:test |
              jq -Sc '.[0] | {rootfs: .RootFS, config: (.Config | del(.Labels))}' |
              sha256sum | cut -d ' ' -f 1
          )
          echo "sha256=$image_fingerprint" >> "$GITHUB_OUTPUT"

  publish:
    name: Publish Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
      id-token: write
      attestations: write
    steps:
      - name: Checkout release commit
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
            ${{ github.repository == 'albaranovsky/yandex-disk-docker' && env.DOCKERHUB_REPO || '' }}
          tags: |
            type=raw,value=latest
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,format=short

      - name: Prepare release image from tested cache
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          load: true
          tags: yandex-disk:release
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ needs.build.outputs.cache_scope }}

      - name: Verify release image matches tested content
        shell: bash
        env:
          EXPECTED_FINGERPRINT: ${{ needs.build.outputs.image_fingerprint }}
        run: |
          image_fingerprint=$(
            docker image inspect yandex-disk:release |
              jq -Sc '.[0] | {rootfs: .RootFS, config: (.Config | del(.Labels))}' |
              sha256sum | cut -d ' ' -f 1
          )
          if [ "$image_fingerprint" != "$EXPECTED_FINGERPRINT" ]; then
            echo "::error::Release image differs from tested filesystem or runtime configuration"
            exit 1
          fi

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to Docker Hub
        if: github.repository == 'albaranovsky/yandex-disk-docker'
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push Docker image
        id: push
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: mode=max
          sbom: true

      - name: Attest build provenance
        uses: actions/attest-build-provenance@v4
        with:
          subject-name: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true

      - name: Update Docker Hub description
        if: github.repository == 'albaranovsky/yandex-disk-docker' && steps.push.outcome == 'success'
        uses: peter-evans/dockerhub-description@v5
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
          repository: ${{ env.DOCKERHUB_REPO }}
          short-description: "Lightweight and secure Yandex.Disk CLI client in Docker with automated sync and non-root user"
          readme-filepath: ./DOCKERHUB.md
          enable-url-completion: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
