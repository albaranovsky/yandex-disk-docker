services:
  yandex-disk:
    build: .
    image: yandex-disk:latest
    # Or use pre-built image from Docker Hub or GHCR:
    # image: albaranovsky/yandex-disk-docker:latest
    # image: ghcr.io/albaranovsky/yandex-disk-docker:latest
    platform: linux/amd64
    container_name: yandex-disk
    restart: unless-stopped
    stop_grace_period: 30s # Time for clean database commit and lock release

    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

    # environment:
    #   - EXCLUDE=temp,cache # Comma-separated list of folders to exclude
    #   - PROXY=http://user:pass@host:port # or socks5://host:port
    #   # PUID and PGID are auto-detected from the mounted folder on the host.
    #   # Specify explicitly only if you need to override:
    #   # - PUID=1000
    #   # - PGID=1000

    volumes:
      # Option 1: Unified storage (config and disk subfolders are created automatically)
      - ./data:/data
      # Option 2: Split storage (uncomment if needed)
      # - ./config:/data/config
      # - ./disk:/data/disk
      # Match host timezone in logs (optional):
      # - /etc/localtime:/etc/localtime:ro

    # Security hardening (optional):
    # read_only: true
    # tmpfs:
    #   - /tmp
    #   - /run
    # security_opt:
    #   - no-new-privileges:true

    # Resource limits (optional):
    # mem_limit: 1g
    # cpus: 1.0
