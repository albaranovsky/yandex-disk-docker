services:
  yandex-disk:
    build: .
    image: yandex-disk:latest
    # Or use pre-built image from Docker Hub or GHCR:
    # image: yadisk/yandex-disk:latest
    # image: ghcr.io/albaranovsky/yandex-disk-docker:latest
    platform: linux/amd64
    container_name: yandex-disk
    user: "1000:1000" # Set to the host storage owner's UID:GID
    restart: unless-stopped
    stop_grace_period: 30s # Time for graceful shutdown, sync state flush, and lock release

    # environment:
    #   - EXCLUDE=temp,cache # Comma-separated list of folders to exclude
    #   - PROXY=https,proxy.example.com,3128 # protocol,host,port[,login,password]

    volumes:
      # Prepare ./data/config and ./data/disk with permissions for the selected user
      - ./data:/data
      # Option 2: Split storage (uncomment if needed)
      # - ./config:/data/config
      # - ./disk:/data/disk
      # Match host timezone in logs (optional):
      # - /etc/localtime:/etc/localtime:ro

    # Security hardening (optional):
    # read_only: true
    # tmpfs:
    #   - /tmp
    #   - /run
    # security_opt:
    #   - no-new-privileges:true

    # Resource limits (optional):
    # mem_limit: 1g
    # cpus: 1.0
